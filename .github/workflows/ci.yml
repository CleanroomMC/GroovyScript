name: CI

on:
  push:
    branches:
      - master
      - 'develop/**'
    paths-ignore:
      - 'LICENSE'
      - 'README.md'
      - 'examples/**'
      - 'editors/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, review_requested]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: CleanroomMC/Conventions/.github/workflows/build.yml@1.4.5
