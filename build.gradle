import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
    id 'com.gradleup.shadow' version '9.6.+'
    // Every convention plugin except style, GroovyScript keeps its own formatting
    id 'com.cleanroommc.conventions.base'
    id 'com.cleanroommc.conventions.license'
    id 'com.cleanroommc.conventions.annotations'
    id 'com.cleanroommc.conventions.publishing'
    id 'com.cleanroommc.conventions.mod'
}

conventions {
    beginFrom = 2022
    repositoryUrl = 'https://github.com/CleanroomMC/GroovyScript'
    header {
        // Derived from Prominic's Groovy Language Server, under Apache 2.0
        exclude('net/prominic/**')
    }
    mods {
        curseforge = '687577'
        modrinth = 'GJaDRTrb'
        curseforge {
            javaVersions.add(JavaVersion.VERSION_1_8)
            client = true
            server = true
            requires 'mixin-booter'
            // Mods that GroovyScript has compat for
            optional 'actually-additions', 'additional-enchanted-miner', 'advanced-mortars', 'advanced-rocketry',
                    'advanced-rocketry-2', 'aether', 'alchemistry', 'angry-pixel-the-betweenlands-mod',
                    'applied-energistics-2', 'arcane-archives', 'arcane-world', 'astral-sorcery', 'atum', 'avaritia-1-10',
                    'better-with-addons', 'bewitchment', 'blood-arsenal', 'blood-magic', 'botania', 'botania-tweaks',
                    'botanic-additions', 'bwm-suite', 'bwm-core', 'calculator', 'chisel', 'compact-machines',
                    'constructs-armory', 'cyclic', 'draconic-evolution', 'ender-io', 'essentialcraft-4-unofficial',
                    'evilcraft', 'extended-crafting', 'extrabotany', 'extra-utilities', 'forestry', 'future-mc',
                    'had-enough-items', 'horse-power', 'ic2-classic', 'ice-and-fire-dragons', 'immersive-engineering',
                    'immersive-petroleum', 'industrial-craft', 'industrial-foregoing', 'inspirations',
                    'integrated-dynamics', 'lazy-ae2', 'magneticraft', 'mct-immersive-technology', 'mekanism',
                    'mystical-agriculture', 'natures-aura', 'pneumaticcraft-repressurized', 'primal-tech', 'prodigy-tech',
                    'projecte', 'pyrotech', 'random-things', 'rustic', 'roots', 'silents-gems', 'techreborn', 'thaumcraft',
                    'the-aurorian', 'thermal-expansion', 'tinkers-construct', 'tinkers-complement', 'woot'
        }
        modrinth {
            requires 'mixinbooter'
        }
    }
}

publishMods {
    displayName = "GroovyScript \u2212 ${project.version}"
    additionalFiles.from(tasks.named('shadowJar'), tasks.named('sourcesJar'))
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'stable'
    mcpMappingVersion = '39'
    useDependencyAccessTransformers = true

    injectedTags = [
            VERSION       : project.version.toString(),
            MODID         : 'groovyscript',
            MODNAME       : 'GroovyScript',
            GROOVY_VERSION: groovy_version
    ]

    extraRunJvmArguments.addAll('-ea:com.cleanroommc.groovyscript', '-Dmixin.checks.interfaces=true', '-Dmixin.debug.export=true', '-Dterminal.jline=true')
    if (project.dev_use_examples_folder.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.use_examples_folder=true')
    }
    if (project.dev_run_ls.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.run_ls=true')
    }
    if (project.dev_generate_examples.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.generate_examples=true')
    }
    if (project.dev_generate_wiki.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.generate_wiki=true')
    }
    if (project.dev_generate_and_crash.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.generate_and_crash=true')
    }
    if (project.dev_log_missing_lang_keys.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.log_missing_lang_keys=true')
    }
    if (project.dev_disable_cache.toBoolean()) {
        extraRunJvmArguments.add('-Dgroovyscript.disable_cache=true')
    }
}

tasks.named('injectTags') {
    outputClassName = 'com.cleanroommc.groovyscript.Tags'
}

apply from: 'repositories.gradle'
apply from: 'dependencies.gradle'

dependencies {
    // Jabel compiles modern Java syntax down to Java 8 bytecode
    annotationProcessor 'com.github.bsideup.jabel:jabel-javac-plugin:1.0.0'
    // Workaround for https://github.com/bsideup/jabel/issues/174
    annotationProcessor 'net.java.dev.jna:jna-platform:5.13.0'
    compileOnly('com.github.bsideup.jabel:jabel-javac-plugin:1.0.0') {
        transitive = false
    }
    // Allow jdk.unsupported classes like sun.misc.Unsafe, workaround for JDK-8206937
    patchedMinecraft 'me.eigenraven.java8unsupported:java-8-unsupported-shim:1.0.0'

    def mixin = modUtils.enableMixins('zone.rong:mixinbooter:11.18', 'mixins.groovyscript.refmap.json')
    api(mixin) {
        transitive = false
    }
    annotationProcessor mixin
}

def modernJava = { JavaToolchainSpec spec ->
    spec.languageVersion = JavaLanguageVersion.of(16)
    spec.vendor = JvmVendorSpec.AZUL
}

tasks.named('compileJava', JavaCompile) {
    options.release = 8
    javaCompiler = javaToolchains.compilerFor(modernJava)
}

// Jabel only patches javac, so javadoc has to read the sources as Java 16
tasks.named('javadoc', Javadoc) {
    javadocTool = javaToolchains.javadocToolFor(modernJava)
    options.source = '16'
    // Mixin requires @reason on every @Overwrite
    options.tags('reason:a:Reason:')
}

processResources {
    def modVersion = project.version.toString()
    inputs.property 'version', modVersion
    filesMatching('mcmod.info') {
        expand(version: modVersion, mcversion: '1.12.2')
    }
}

jar {
    manifest {
        attributes(
                'FMLCorePlugin': 'com.cleanroommc.groovyscript.core.GroovyScriptCore',
                'FMLCorePluginContainsFMLMod': true,
                'ForceLoadAsMod': true
        )
    }
}

// reobfJar reads the uber jar so the shaded libraries end up in the release jar
tasks.named('reobfJar') {
    inputJar = tasks.named('shadowJar').flatMap { it.archiveFile }
}

tasks.named('shadowJar') {
    archiveClassifier = 'uberdev'
    configurations = [project.configurations.shade]
    // RFG adds the generated Tags class to jar only
    from sourceSets.injectedTags.output
    // FML's ASM can't read classgraph's Java 9 module-info, the rest is unneeded metadata from shaded libraries
    exclude 'META-INF/versions/**', 'META-INF/maven/**', 'about*.html'
    addMultiReleaseAttribute = false
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Run Client'(Gradle) {
                    taskNames = ['runClient']
                }
                '2. Run Server'(Gradle) {
                    taskNames = ['runServer']
                }
                '3. Run Obfuscated Client'(Gradle) {
                    taskNames = ['runObfClient']
                }
                '4. Run Obfuscated Server'(Gradle) {
                    taskNames = ['runObfServer']
                }
            }
            taskTriggers {
                afterSync 'injectTags'
            }
        }
    }
}
