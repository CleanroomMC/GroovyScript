pluginManagement {
    repositories {
        maven {
            url = 'https://maven.cleanroommc.com'
        }
        maven {
            // RetroFuturaGradle
            name = 'GTNH Maven'
            url = 'https://nexus.gtnewhorizons.com/repository/public/'
            mavenContent {
                includeGroup 'com.gtnewhorizons'
                includeGroup 'com.gtnewhorizons.retrofuturagradle'
            }
        }
        gradlePluginPortal()
    }
}

plugins {
    id 'com.cleanroommc.conventions.settings' version '1.4.5'
}

rootProject.name = 'groovyscript'
